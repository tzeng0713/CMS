server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 開 gzip 壓縮 JSON 回應跟前端打包檔案，減少傳輸量，e2-micro 網路頻寬/CPU
    # 吃緊的情況下對使用者感受到的回應速度有幫助。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        font/ttf
        font/otf
        image/svg+xml;

    # 整站共用一組帳密，擋在 CMS 系統自己的登入頁之前，避免不知道這組密碼的人
    # 連系統存在、長怎樣都看不到。密碼檔由 docker-compose 掛載進來（見 nginx/.htpasswd）。
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 合約影像上傳檔案：跟後端共用同一個 docker volume（見 docker-compose.yml），
    # 後端目前沒有提供下載這些檔案的 API，由這裡直接當靜態檔案服務。
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
