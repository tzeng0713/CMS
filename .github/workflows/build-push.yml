name: Build and push images

# 不是 push 就自動上版——只有壓了符合格式的 tag 才會觸發建置＋推送。
# Tag 格式：<環境>-<YYYYMMDD>.<序號>，例如 dev-20261103.01、main-20261103.01，
# 同一天要重新上版就把序號往上加一（.02、.03...）。
# 環境前綴（tag 第一個 "-" 之前的部分）決定推去哪個 image tag：
#   dev-20261103.01  → ghcr.io/.../cms-backend:dev（VM 預設 pull 這個）
#   main-20261103.01 → ghcr.io/.../cms-backend:main
# 同時也會推一份跟 tag 同名的快照（例如 :dev-20261103.01），方便之後要回滾某個特定版本時
# 直接把 VM 的 .env 的 IMAGE_TAG 改成那個快照標籤。
#
# 怎麼觸發：在要上版的那個分支上壓 tag 並 push：
#   git checkout dev && git tag dev-20261103.01 && git push origin dev-20261103.01
#
# workflow_dispatch 讓你可以在 GitHub 網頁上手動重新觸發一次（會用當下分支名稱當環境）。
on:
  push:
    tags:
      - 'dev-*'
      - 'main-*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine target environment
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ENVIRONMENT="${TAG_NAME%%-*}"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cms-backend:${{ steps.vars.outputs.environment }}
            ghcr.io/${{ github.repository_owner }}/cms-backend:${{ steps.vars.outputs.tag_name }}
          cache-from: type=gha,scope=backend-${{ steps.vars.outputs.environment }}
          cache-to: type=gha,mode=max,scope=backend-${{ steps.vars.outputs.environment }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cms-frontend:${{ steps.vars.outputs.environment }}
            ghcr.io/${{ github.repository_owner }}/cms-frontend:${{ steps.vars.outputs.tag_name }}
          cache-from: type=gha,scope=frontend-${{ steps.vars.outputs.environment }}
          cache-to: type=gha,mode=max,scope=frontend-${{ steps.vars.outputs.environment }}
